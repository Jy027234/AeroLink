name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  secret_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci_contract:
    name: CI Workflow Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Verify Node runtime
        run: node scripts/ci/check-node-runtime.mjs

      - name: Verify CI workflow contract
        run: node scripts/ci/check-workflow-contract.mjs

  audit_frontend:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.audit_summary.outputs.production }}
      development: ${{ steps.audit_summary.outputs.development }}
      status: ${{ steps.audit_summary.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Verify Node runtime
        run: node scripts/ci/check-node-runtime.mjs

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Audit production dependencies
        id: audit_production
        if: always()
        continue-on-error: true
        run: node scripts/ci/run-npm-audit.mjs --mode production --label frontend --output-dir ci-artifacts/audit/frontend

      - name: Audit production and development dependencies
        id: audit_development
        if: always()
        continue-on-error: true
        run: node scripts/ci/run-npm-audit.mjs --mode development --label frontend --output-dir ci-artifacts/audit/frontend

      - name: Upload frontend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-audit-frontend-${{ github.sha }}
          path: ci-artifacts/audit/frontend/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize frontend audit result
        id: audit_summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.audit_production.outcome }}
          DEVELOPMENT_OUTCOME: ${{ steps.audit_development.outcome }}
        run: |
          if [[ "$INSTALL_OUTCOME" == "success" && "$PRODUCTION_OUTCOME" == "success" ]]; then
            echo "production=pass" >> "$GITHUB_OUTPUT"
          else
            echo "production=fail" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$INSTALL_OUTCOME" == "success" && "$DEVELOPMENT_OUTCOME" == "success" ]]; then
            echo "development=pass" >> "$GITHUB_OUTPUT"
          else
            echo "development=fail" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$INSTALL_OUTCOME" == "success" && "$PRODUCTION_OUTCOME" == "success" && "$DEVELOPMENT_OUTCOME" == "success" ]]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

  audit_backend:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.audit_summary.outputs.production }}
      development: ${{ steps.audit_summary.outputs.development }}
      status: ${{ steps.audit_summary.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Verify Node runtime
        run: node scripts/ci/check-node-runtime.mjs

      - name: Install dependencies
        id: install
        continue-on-error: true
        working-directory: ./server
        run: npm ci

      - name: Audit production dependencies
        id: audit_production
        if: always()
        continue-on-error: true
        run: node scripts/ci/run-npm-audit.mjs --package-dir server --mode production --label backend --output-dir ci-artifacts/audit/backend

      - name: Audit production and development dependencies
        id: audit_development
        if: always()
        continue-on-error: true
        run: node scripts/ci/run-npm-audit.mjs --package-dir server --mode development --label backend --output-dir ci-artifacts/audit/backend

      - name: Upload backend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-audit-backend-${{ github.sha }}
          path: ci-artifacts/audit/backend/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize backend audit result
        id: audit_summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.audit_production.outcome }}
          DEVELOPMENT_OUTCOME: ${{ steps.audit_development.outcome }}
        run: |
          if [[ "$INSTALL_OUTCOME" == "success" && "$PRODUCTION_OUTCOME" == "success" ]]; then
            echo "production=pass" >> "$GITHUB_OUTPUT"
          else
            echo "production=fail" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$INSTALL_OUTCOME" == "success" && "$DEVELOPMENT_OUTCOME" == "success" ]]; then
            echo "development=pass" >> "$GITHUB_OUTPUT"
          else
            echo "development=fail" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$INSTALL_OUTCOME" == "success" && "$PRODUCTION_OUTCOME" == "success" && "$DEVELOPMENT_OUTCOME" == "success" ]]; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend Functional Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Verify Node runtime
        working-directory: .
        run: node scripts/ci/check-node-runtime.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backend tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate observability retention contract
        run: npm run observability:retention-check

  frontend:
    name: Frontend Functional Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Verify Node runtime
        run: node scripts/ci/check-node-runtime.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI contract and generated types
        run: npm run api:check

      - name: Verify vendored presentation distribution
        run: node scripts/ci/check-vendored-pptxgen.mjs

      - name: Validate feature boundaries
        run: npm run features:check

      - name: Validate server module boundaries
        run: npm run modules:check

      - name: Run frontend unit tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aerolink:ci-password@127.0.0.1:5432/aerolink?schema=public
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      CLIENT_URL: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:3000/api
      DEMO_SEED_PASSWORD: ci-demo-password-2026
      E2E_PASSWORD: ci-demo-password-2026
      # Controlled fixture only: production defaults to disabled.
      FEATURE_AGENT_DEMO: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerolink
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aerolink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerolink -d aerolink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Verify Node runtime
        run: node scripts/ci/check-node-runtime.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Prepare isolated E2E database
        working-directory: ./server
        run: npx prisma migrate deploy --schema prisma/schema.prisma && npm run db:seed

      - name: Run PostgreSQL reconciliation gates
        working-directory: ./server
        run: >-
          npm run db:check:inventory-reconciliation &&
          npm run db:check:money-reconciliation &&
          npm run db:check:json-configuration-reconciliation &&
          npm run db:check:transaction-status-reconciliation

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run navigation regression E2E
        run: npm run test:e2e:navigation-regression
        env:
          CI: true

      - name: Run quotation and contract regression E2E
        run: npm run test:e2e:quotation-contract-regression
        env:
          CI: true

      - name: Run full E2E tests
        run: npm run test:e2e
        env:
          CI: true

  release_gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [secret_scan, ci_contract, audit_frontend, audit_backend, backend, frontend, e2e]
    if: always()
    steps:
      - name: Evaluate complete CI evidence
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
          CI_CONTRACT_RESULT: ${{ needs.ci_contract.result }}
          AUDIT_FRONTEND_RESULT: ${{ needs.audit_frontend.result }}
          AUDIT_FRONTEND_PRODUCTION: ${{ needs.audit_frontend.outputs.production }}
          AUDIT_FRONTEND_DEVELOPMENT: ${{ needs.audit_frontend.outputs.development }}
          AUDIT_BACKEND_RESULT: ${{ needs.audit_backend.result }}
          AUDIT_BACKEND_PRODUCTION: ${{ needs.audit_backend.outputs.production }}
          AUDIT_BACKEND_DEVELOPMENT: ${{ needs.audit_backend.outputs.development }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -u
          mkdir -p ci-evidence
          {
            echo "AeroLink CI release evidence"
            echo "SHA: $GITHUB_SHA"
            echo "Workflow: $GITHUB_RUN_ID"
            echo
            echo "secret_scan=$SECRET_SCAN_RESULT"
            echo "ci_contract=$CI_CONTRACT_RESULT"
            echo "audit_frontend_job=$AUDIT_FRONTEND_RESULT"
            echo "audit_frontend_production=$AUDIT_FRONTEND_PRODUCTION"
            echo "audit_frontend_development=$AUDIT_FRONTEND_DEVELOPMENT"
            echo "audit_backend_job=$AUDIT_BACKEND_RESULT"
            echo "audit_backend_production=$AUDIT_BACKEND_PRODUCTION"
            echo "audit_backend_development=$AUDIT_BACKEND_DEVELOPMENT"
            echo "backend=$BACKEND_RESULT"
            echo "frontend=$FRONTEND_RESULT"
            echo "e2e=$E2E_RESULT"
          } | tee ci-evidence/release-gate.txt

          failed=0
          for result in \
            "$SECRET_SCAN_RESULT" \
            "$CI_CONTRACT_RESULT" \
            "$AUDIT_FRONTEND_RESULT" \
            "$AUDIT_BACKEND_RESULT" \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$E2E_RESULT"; do
            if [[ "$result" != "success" ]]; then failed=1; fi
          done
          for audit in \
            "$AUDIT_FRONTEND_PRODUCTION" \
            "$AUDIT_FRONTEND_DEVELOPMENT" \
            "$AUDIT_BACKEND_PRODUCTION" \
            "$AUDIT_BACKEND_DEVELOPMENT"; do
            if [[ "$audit" != "pass" ]]; then failed=1; fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "Release gate failed: every required job and audit layer must pass; failures and skips remain blocking."
            exit 1
          fi
          echo "Release gate passed: all functional, E2E, secret, contract, and layered audit evidence passed."

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-gate-${{ github.sha }}
          path: ci-evidence/release-gate.txt
          if-no-files-found: error
          retention-days: 30
